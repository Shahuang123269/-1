[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-agent"
version = "0.2.0"
description = "Auditable GitHub issue triage with DeepSeek, LangGraph and MCP"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2.12,<2", "langgraph-checkpoint-sqlite>=3.1,<4",
  "mcp>=1.30,<2", "openai>=2.54,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "pydantic-settings>=2,<3", "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["issue_agent*"]

[tool.setuptools.package-data]
issue_agent = ["ui.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".test-runs", "examples/original-demo"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
