name: checks
on:
  workflow_dispatch:
  repository_dispatch:
    types: [verification_requested]
  push:
    paths-ignore: ['docs/**', 'reports/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'reports/**', 'README.md']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m issue_agent.evaluate --report reports/ci-fixture.json
      - name: Build and exercise Docker image
        if: runner.os == 'Linux'
        run: |
          docker build -t issue-agent:ci .
          docker run --rm issue-agent:ci python -m issue_agent.demo
      - name: Exercise separate API and worker with Compose
        if: runner.os == 'Linux'
        env:
          IA_API_TOKEN: ci-fixture-only-token
        run: |
          cp .env.example .env
          trap 'docker compose -p issue-agent-ci down -v' EXIT
          docker compose -p issue-agent-ci up -d --build
          python scripts/deployment_smoke.py --token "$IA_API_TOKEN"
          worker_id=$(docker compose -p issue-agent-ci ps -q worker)
          docker compose -p issue-agent-ci stop -t 15 worker
          test "$(docker inspect --format '{{.State.ExitCode}}' "$worker_id")" = 0
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-report-${{ matrix.os }}
          path: reports/ci-fixture.json
